<script>
const messagesEl = document.getElementById("messages");
let typingEl = document.getElementById("typing");
const inputEl = document.getElementById("userInput");
const micBtn = document.getElementById("micBtn");

let recognition;
let isRecording = false;

function adjustTextarea() {
  inputEl.style.height = "auto";
  inputEl.style.height =
    Math.min(inputEl.scrollHeight, 110) + "px";
}

function pickStarter(btn) {
  inputEl.value = btn.textContent;
  sendMessage();
}

function appendMessage(text, role) {

  const div = document.createElement("div");

  div.className = "msg " + role;

  div.innerHTML = text.replace(/\n/g, "<br>");

  messagesEl.insertBefore(div, typingEl);

  scrollToBottom();

}

function scrollToBottom() {

  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

}

async function sendMessage() {

  const text = inputEl.value.trim();

  if (!text) return;

  appendMessage(text, "user");

  inputEl.value = "";

  adjustTextarea();

  typingEl.style.display = "block";

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          {
            role: "user",
            content: text
          }
        ]
      })
    });

    const data = await response.json();

    typingEl.style.display = "none";

    appendMessage(
      data.reply ||
      "Something went wrong. Try again in a second.",
      "bot"
    );

  } catch (error) {

    console.error(error);

    typingEl.style.display = "none";

    appendMessage(
      "Something went wrong. Try again in a second.",
      "bot"
    );

  }

}

function saveTranscript() {
  alert("Transcript saved.");
}

function startAgain() {
  location.reload();
}

// REAL VOICE MODE

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-GB";

  recognition.interimResults = false;

  recognition.continuous = false;

  recognition.onstart = () => {

    isRecording = true;

    micBtn.style.background = "#326ab3";

    micBtn.style.borderColor = "#326ab3";

    micBtn.querySelector("svg").style.fill = "#fff";

  };

  recognition.onend = () => {

    isRecording = false;

    micBtn.style.background = "#fff";

    micBtn.style.borderColor =
      "rgba(50,106,179,0.15)";

    micBtn.querySelector("svg").style.fill =
      "#326ab3";

  };

  recognition.onerror = (event) => {

    console.error(event.error);

    isRecording = false;

    micBtn.style.background = "#fff";

    micBtn.querySelector("svg").style.fill =
      "#326ab3";

    alert(
      "Voice recognition error. Try Chrome."
    );

  };

  recognition.onresult = (event) => {

    const transcript =
      event.results[0][0].transcript;

    inputEl.value = transcript;

    adjustTextarea();

  };

}

function toggleVoice() {

  if (!SpeechRecognition) {

    alert(
      "Voice recognition is not supported in this browser. Try Chrome."
    );

    return;

  }

  if (isRecording) {

    recognition.stop();

  } else {

    recognition.start();

  }

}
</script>
