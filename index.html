<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Audience Growth Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #eef6f8;
      font-family: Inter, sans-serif;
      color: #16333d;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 620px;
      background: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #dbe8ec;
      border-right: 1px solid #dbe8ec;
    }

    .header {
      padding: 28px 24px 18px;
      border-bottom: 1px solid #e7eff2;
      background: linear-gradient(180deg, #144a93 0%, #1e5cab 100%);
      color: white;
    }

    .header h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -1px;
      font-weight: 700;
    }

    .header p {
      margin-top: 10px;
      opacity: 0.9;
      line-height: 1.5;
      font-size: 15px;
      max-width: 500px;
    }

    .messages {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f7fbfc;
    }

    .message {
      max-width: 88%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .assistant {
      background: white;
      border: 1px solid #dfecef;
      align-self: flex-start;
    }

    .user {
      background: #d8f3f4;
      align-self: flex-end;
      border: 1px solid #b8e4e7;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #dde9ed;
      background: white;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #cfe0e5;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      min-height: 54px;
      max-height: 180px;
      line-height: 1.5;
      background: #f9fcfd;
    }

    button {
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: inherit;
    }

    .send-btn {
      background: #144a93;
      color: white;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .send-btn:hover {
      background: #103c77;
    }

    .voice-btn {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #dff4f6;
      color: #144a93;
      font-size: 20px;
      flex-shrink: 0;
    }

    .voice-btn.recording {
      background: #144a93;
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    @media (max-width: 640px) {
      .header h1 {
        font-size: 28px;
      }

      .message {
        font-size: 14px;
      }

      textarea {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <h1>Audience Growth Bot</h1>
      <p>
        Okay. Let’s stop trying to solve all of it at once and figure out what actually matters first.
      </p>
    </div>

    <div class="messages" id="messages">
      <div class="message assistant">
        You probably don’t need more ideas right now.

        You need a bit more clarity around what’s actually creating movement.
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">

        <button class="voice-btn" id="voiceBtn">
          🎤
        </button>

        <textarea
          id="messageInput"
          placeholder="Tell me what feels messy right now..."
        ></textarea>

        <button class="send-btn" id="sendBtn">
          Send
        </button>

      </div>
    </div>

  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const voiceBtn = document.getElementById("voiceBtn");

    let conversation = [];

    function addMessage(content, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = content;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      conversation.push({
        role: "user",
        content: text
      });

      input.value = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: conversation
          })
        });

        const data = await response.json();

        addMessage(data.reply, "assistant");

        conversation.push({
          role: "assistant",
          content: data.reply
        });

      } catch (error) {
        console.error(error);

        addMessage(
          "Something went wrong. Try again in a second.",
          "assistant"
        );
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // VOICE MODE

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {

      const recognition = new SpeechRecognition();

      recognition.lang = "en-GB";
      recognition.interimResults = false;
      recognition.continuous = false;

      voiceBtn.addEventListener("click", () => {
        recognition.start();
        voiceBtn.classList.add("recording");
      });

      recognition.onresult = (event) => {
        const transcript =
          event.results[0][0].transcript;

        input.value = transcript;
        voiceBtn.classList.remove("recording");
      };

      recognition.onerror = () => {
        voiceBtn.classList.remove("recording");
      };

      recognition.onend = () => {
        voiceBtn.classList.remove("recording");
      };

    } else {

      voiceBtn.addEventListener("click", () => {
        alert(
          "Voice recognition is not supported in this browser. Try Chrome."
        );
      });

    }
  </script>
</body>
</html>
