<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#326ab3" />
  <title>Ask Nina – Grow your audience, your way</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f4f1;
      color: #1a2a3a;
    }

    .page-shell {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      background: #f5f4f1;
    }

    .app-container {
      width: 100%;
      max-width: 620px;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(50,106,179,0.15);
      border-right: 1px solid rgba(50,106,179,0.15);
    }

    .header {
      background: #326ab3;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #85d0cd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }

    .header-text {
      flex: 1;
    }

    .header-text .name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .header-text .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.9);
      margin-top: 2px;
      font-style: italic;
    }

    .header-buttons {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      color: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fff;
      border-bottom: 1px solid rgba(50,106,179,0.12);
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 82%;
      padding: 14px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.55;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.bot {
      align-self: flex-start;
      background: #eef4fb;
      border: 1px solid rgba(50,106,179,0.12);
      color: #1a2a3a;
    }

    .msg.user {
      align-self: flex-end;
      background: #326ab3;
      color: #fff;
    }

    .starter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      max-width: 82%;
    }

    .qr-btn {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      border: 1.5px solid #85d0cd;
      color: #326ab3;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .qr-btn:hover {
      background: #eef4fb;
    }

    .typing-indicator {
      align-self: flex-start;
      padding: 12px 14px;
      background: #eef4fb;
      border-radius: 20px;
      border: 1px solid rgba(50,106,179,0.12);
      display: none;
    }

    .typing-indicator span {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #85d0cd;
      border-radius: 50%;
      margin-right: 3px;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.3s;
      margin-right: 0;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-3px);
      }
    }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(50,106,179,0.12);
      background: #fff;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      padding: 11px 16px;
      border: 1.5px solid rgba(50,106,179,0.15);
      border-radius: 999px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 110px;
      line-height: 1.4;
      background: #fff;
    }

    textarea:focus {
      border-color: #326ab3;
    }

    .mic-btn,
    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .mic-btn {
      border: 1.5px solid rgba(50,106,179,0.15);
      background: #fff;
    }

    .mic-btn:hover {
      border-color: #326ab3;
      background: #eef4fb;
    }

    .mic-btn svg {
      width: 18px;
      height: 18px;
      fill: #326ab3;
    }

    .send-btn {
      background: #326ab3;
      color: #fff;
      border: none;
      font-size: 18px;
    }

    .send-btn:hover {
      background: #285999;
    }

    .footer-note {
      text-align: center;
      padding: 10px 14px;
      font-size: 11px;
      color: #9b9488;
      line-height: 1.5;
      border-bottom: 1px solid rgba(50,106,179,0.12);
      background: #fff;
    }

    .footer {
      text-align: center;
      padding: 10px 14px;
      font-size: 10px;
      color: #aaa39a;
      letter-spacing: 0.08em;
      background: #fff;
    }

    @media (max-width: 760px) {
      .app-container {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }

      .msg {
        max-width: 90%;
      }

      .starter-buttons {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="page-shell">
  <div class="app-container">

    <div class="header">
      <div class="header-avatar">♥</div>

      <div class="header-text">
        <div class="name">Ask Nina</div>
        <div class="subtitle">Grow your audience, your way</div>
      </div>

      <div class="header-buttons">
        <button class="icon-btn" onclick="saveTranscript()">Save</button>
        <button class="icon-btn" onclick="startAgain()">Start again</button>
      </div>
    </div>

    <div class="messages" id="messages">

      <div class="msg bot">
        Hey. Where do you want to start?
      </div>

      <div class="starter-buttons" id="starters">
        <button class="qr-btn" onclick="pickStarter(this)">Grow my audience</button>
        <button class="qr-btn" onclick="pickStarter(this)">Get the right people finding me</button>
        <button class="qr-btn" onclick="pickStarter(this)">Get people through the door</button>
        <button class="qr-btn" onclick="pickStarter(this)">Nothing's really stuck yet</button>
      </div>

      <div class="typing-indicator" id="typing">
        <span></span><span></span><span></span>
      </div>

    </div>

    <div class="input-row">

      <textarea
        id="userInput"
        rows="1"
        placeholder="Chat to Nina..."
      ></textarea>

      <button class="mic-btn" id="micBtn" onclick="toggleVoice()">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>

      <button class="send-btn" onclick="sendMessage()">↑</button>

    </div>

    <div class="footer-note">
      Your progress saves to this browser only. Return here on the same device to pick up where you left off.<br>
      Prefer to talk? Hit the 🎤 and chat to me by voice note.
    </div>

    <div class="footer">
      Nina Mistry · grow your audience, your way
    </div>

  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const typingEl = document.getElementById("typing");
const inputEl = document.getElementById("userInput");
const micBtn = document.getElementById("micBtn");

let recognition;
let isRecording = false;
let conversation = [];

function adjustTextarea() {
  inputEl.style.height = "auto";
  inputEl.style.height =
    Math.min(inputEl.scrollHeight, 110) + "px";
}

function pickStarter(btn) {
  inputEl.value = btn.textContent;
  adjustTextarea();
  sendMessage();
}

function appendMessage(text, role) {

  const div = document.createElement("div");

  div.className = "msg " + role;

  div.innerHTML = text.replace(/\n/g, "<br>");

  messagesEl.insertBefore(div, typingEl);

  scrollToBottom();

}

function scrollToBottom() {

  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

}

async function sendMessage() {

  const text = inputEl.value.trim();

  if (!text) return;

  appendMessage(text, "user");

  conversation.push({
    role: "user",
    content: text
  });

  inputEl.value = "";

  adjustTextarea();

  typingEl.style.display = "block";

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: conversation
      })
    });

    const data = await response.json();

    typingEl.style.display = "none";

    appendMessage(
      data.reply ||
      "Something went wrong. Try again in a second.",
      "bot"
    );

    conversation.push({
      role: "assistant",
      content: data.reply
    });

  } catch (error) {

    console.error(error);

    typingEl.style.display = "none";

    appendMessage(
      "Something went wrong. Try again in a second.",
      "bot"
    );

  }

}

function saveTranscript() {
  alert("Transcript saved.");
}

function startAgain() {
  location.reload();
}

inputEl.addEventListener("input", adjustTextarea);

inputEl.addEventListener("keydown", (event) => {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

});

// VOICE MODE

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-GB";

  recognition.interimResults = false;

  recognition.continuous = false;

  recognition.onstart = () => {

    isRecording = true;

    micBtn.style.background = "#326ab3";

    micBtn.style.borderColor = "#326ab3";

    micBtn.querySelector("svg").style.fill = "#fff";

  };

  recognition.onend = () => {

    isRecording = false;

    micBtn.style.background = "#fff";

    micBtn.style.borderColor =
      "rgba(50,106,179,0.15)";

    micBtn.querySelector("svg").style.fill =
      "#326ab3";

  };

  recognition.onerror = (event) => {

    console.error(event.error);

    isRecording = false;

    micBtn.style.background = "#fff";

    micBtn.querySelector("svg").style.fill =
      "#326ab3";

    alert(
      "Voice recognition error. Try Chrome."
    );

  };

  recognition.onresult = (event) => {

    const transcript =
      event.results[0][0].transcript;

    inputEl.value = transcript;

    adjustTextarea();

  };

}

function toggleVoice() {

  if (!SpeechRecognition) {

    alert(
      "Voice recognition is not supported in this browser. Try Chrome."
    );

    return;

  }

  if (isRecording) {

    recognition.stop();

  } else {

    recognition.start();

  }

}
</script>

</body>
</html>
